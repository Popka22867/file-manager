app = 'my-telegram-bot'
primary_region = 'fra' # Франкфурт (ближе к нам, меньше пинг)

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']